name: code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Code review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write pull request diff
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --unified=3 "$BASE_SHA"...HEAD > .code-review-pr.diff
          if [ -s .code-review-pr.diff ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cursor CLI
        if: ${{ success() && steps.diff.outputs.has_diff == 'true' }}
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Review pull request
        if: ${{ success() && steps.diff.outputs.has_diff == 'true' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "Set the CURSOR_API_KEY repository secret before this review can run."
            exit 1
          fi
          node --input-type=module -e 'import { mkdirSync, writeFileSync } from "node:fs"; import { homedir } from "node:os"; import { dirname, join } from "node:path"; const path = join(homedir(), ".cursor", "cli-config.json"); mkdirSync(dirname(path), { recursive: true }); writeFileSync(path, JSON.stringify({ version: 1, editor: { vimMode: false }, permissions: { allow: ["Read(**)", "Shell(rg)", "Shell(find)", "Shell(ls)"], deny: ["Shell(git)", "Shell(gh)", "Shell(curl)", "Shell(wget)", "Shell(rm)", "Shell(npm)", "Shell(bash)", "Write(**)", "Read(.env*)", "Read(**/.env*)"] } }, null, 2));'
          agent -p --trust --output-format json "$(cat .github/code-review/prompt.md)" > "$RUNNER_TEMP/agent.json"

      - name: Post inline comments
        if: ${{ success() && steps.diff.outputs.has_diff == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/code-review/post-comments.mjs --review "$RUNNER_TEMP/agent.json" --diff .code-review-pr.diff

      - name: Remove diff file
        if: always()
        run: rm -f .code-review-pr.diff
